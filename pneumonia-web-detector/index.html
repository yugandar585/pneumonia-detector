<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Pneumonia Detector</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.21.0/dist/tf.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f0f8ff; padding: 20px; }
    h1 { color: #2c7da7; }
    #result { font-size: 24px; font-weight: bold; margin: 20px; }
    button { padding: 12px 24px; margin: 10px; font-size: 16px; cursor: pointer; }
    img { max-width: 400px; margin: 20px; border: 2px solid #ddd; border-radius: 10px; }
  </style>
</head>
<body>
  <h1>🩻 AI Pneumonia Detector</h1>
  <p>Upload a Chest X-ray image to check for Pneumonia</p>

  <input type="file" id="fileInput" accept="image/*">
  <br><br>
  <button onclick="useCamera()">📷 Take Photo with Camera</button>

  <div id="preview"></div>
  <div id="result"></div>

  <script src="script.js"></script>
</body>
</html>
